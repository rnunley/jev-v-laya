[project]
name = "jev-v-laya"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["laya==0.3.6", "datasets>=3,<5", "httpx>=0.27,<1", "huggingface-hub>=0.25,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: opt-in paid OpenRouter and local Laya end-to-end run"]
